openapi: 3.0.1
info:
  title: Vigilath GEO Readiness Checker
  description: Audit a URL for Generative Engine Optimization readiness.
  version: "1.0.0"
  contact:
    email: support@zen7.com
servers:
  - url: https://www.vigilath.com/api
paths:
  /check:
    post:
      operationId: runCheck
      summary: Run a GEO audit on a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: The URL to audit.
      responses:
        "200":
          description: Audit result with AI visibility score and category breakdown.
          content:
            application/json:
              schema:
                type: object
                properties:
                  score:
                    type: number
                  grade:
                    type: string
                  categories:
                    type: array
                    items:
                      type: object
  /memberships:
    get:
      operationId: listMemberships
      summary: List available membership plans
      responses:
        "200":
          description: List of plans with pricing and features.
