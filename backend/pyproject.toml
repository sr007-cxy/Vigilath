[tool.poetry]
name = "geo-checker-backend"
version = "0.1.0"
description = "GEO Readiness Checker Backend API"
authors = ["Vigilath contributors"]
packages = [{ include = "geo" }]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-multipart = "^0.0.6"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.2"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
pyjwt = {extras = ["crypto"], version = "^2.10.1"}
sqlalchemy = "^2.0.23"
alembic = "^1.13.0"
pydantic-sqlalchemy = "^0.0.10"
psycopg = {extras = ["binary"], version = "^3.2"}
aiofiles = "^23.2.1"
aiohttp = "^3.9.1"
python-dotenv = "^1.0.0"
redis = "^5.0"
apscheduler = "^3.10.4"
python-docx = "^1.1.0"
pypdf = "^4.0.0"



[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
black = "^23.11.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
