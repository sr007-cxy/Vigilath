# nginx snippet: reverse-proxy /api/agent/* to the standalone agent service (option B).
# Put it inside the test host's server{} (prefix locations use longest match, so /api/agent/ matches before /api/).
location /api/agent/ {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # SSE streaming (/api/agent/chat): buffering off + long timeout
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
}

location /api/sales-agent/ {
    proxy_pass http://127.0.0.1:8010;
