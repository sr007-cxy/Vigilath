# nginx 片段:静态托管 vigilath-geo skill 包,支撑一行安装
#   curl -fsSL https://<host>/skill/install.sh | bash -s -- <token>
# 放进 server{} 里(^~ 让它优先于静态文件正则,确保 .py/.sh 按 text 原样下发)。
location ^~ /skill/ {
    alias /opt/geo/skills/vigilath-geo/;
    default_type text/plain;          # .sh / .py 当纯文本下发,不触发下载/解析
    add_header Cache-Control "no-cache";
    autoindex off;
}
