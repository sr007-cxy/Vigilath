# nginx snippet: the skill's two external entry points. Put it inside server{}.
#
#   1) GET /skill        - "single address" entry, reverse-proxied to the main backend for content negotiation:
#                            opened in a browser -> 302 to the /install page
#                            fetched by an agent / curl -> plain-text install instructions
#   2) GET /skill/*      - static hosting of skill packages, supporting one-line install:
#                            curl -fsSL https://<host>/skill/install.sh | bash
#                            after skills were split into multiple directories, this aliases to the skills/ root,
#                            so paths like /skill/vigilath-site-audit/SKILL.md are reachable.
#
# ★ Order matters: the `= /skill` exact match has the highest priority and is not swallowed by `^~ /skill/` below.
# ★ Reverse-proxy to the agent service (8010) rather than the main backend: 8010 is the same on both sites, while the main backend is test host 8000 / prod 8070,
#   and the same snippet is included by both sites, so hard-coding the main backend port would 502 on one of them.

location = /skill {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Links in the instruction body use this header to choose http/https; it must be present
    proxy_set_header X-Forwarded-Proto $scheme;
    # Note: the backend uses Sec-Fetch-Mode to tell humans from agents; nginx passes this header through by default, so do not set or override it explicitly
}

# /skill/ with a trailing slash is the directory itself (autoindex off would 403); normalize it to the entry above
location = /skill/ {
    # absolute_redirect off: TLS terminates at the upstream proxy and it is http to this host, so nginx would expand relative redirects
    # to http://.../skill, kicking users from https to http. Turning it off only sends a relative Location.
    absolute_redirect off;
    return 302 /skill;
}

# ── Legacy URL compatibility ────────────────────────────────────────────────────────────
# Before splitting into multiple skills, these four paths pointed directly at files in the all-in-one package directory, and one-line install commands,
# docs and user scripts already sent out use them. Exact matches take priority over ^~ below, so old links keep working.
location = /skill/install.sh {
    alias /opt/geo/skills/vigilath-geo/install.sh;
    default_type text/plain;
    add_header Cache-Control "no-cache";
}
location = /skill/SKILL.md {
    alias /opt/geo/skills/vigilath-geo/SKILL.md;
    default_type text/plain;
}
location = /skill/README.md {
    alias /opt/geo/skills/vigilath-geo/README.md;
    default_type text/plain;
}
location = /skill/scripts/geo_client.py {
    alias /opt/geo/skills/vigilath-geo/scripts/geo_client.py;
    default_type text/plain;
}

location ^~ /skill/ {
    alias /opt/geo/skills/;
    default_type text/plain;          # Serve .sh / .py as plain text, without triggering download/parsing
    add_header Cache-Control "no-cache";
    autoindex off;
}
