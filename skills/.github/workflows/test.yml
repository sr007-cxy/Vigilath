name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deliberately install no dependencies: zero third-party dependencies is the foundation of this skill set,
      # and once CI needs pip install, the code has broken that promise.
      - name: Unit tests (client)
        run: python3 tests/test_geo_client.py
      - name: Structure checks (skill frontmatter / command consistency / no internal info)
        run: python3 tests/test_skills_meta.py
      - name: Behavior tests (install.sh)
        run: bash tests/test_install.sh
