[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-checker"
version = "1.0.0"
description = "Check a website's GEO (Generative Engine Optimization) readiness"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
]
keywords = ["geo", "seo", "ai", "llm", "optimization", "crawler", "readiness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
geo-checker = "geo_checker.__main__:main"

[project.urls]
Homepage = "https://github.com/yourusername/geo-checker"
Issues = "https://github.com/yourusername/geo-checker/issues"

[tool.setuptools.packages.find]
include = ["geo_checker*"]
